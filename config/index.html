<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wristmal Settings</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee;
         margin: 0; padding: 20px; }
  h1 { font-size: 1.4em; text-align: center; }
  .card { background: #16213e; border-radius: 12px; padding: 20px; margin: 16px 0; }
  label { display: block; margin: 12px 0 4px; font-size: 0.9em; color: #aaa; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #333;
          border-radius: 8px; background: #0f3460; color: #fff; font-size: 1em; }
  button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 1em;
           cursor: pointer; margin-top: 16px; }
  .btn-login { background: #2e86de; color: #fff; }
  .status { text-align: center; padding: 12px; color: #10ac84; }
  #debug { font-size: 10px; color: #666; word-break: break-all; margin-top: 20px; }
</style>
</head>
<body>
<h1>Wristmal</h1>

<div id="setup" class="card">
  <label>MAL Client ID</label>
  <input id="clientId" placeholder="From myanimelist.net/apiconfig">
  <label>MAL Client Secret</label>
  <input id="clientSecret" type="password" placeholder="From myanimelist.net/apiconfig">
  <button class="btn-login" onclick="saveAndLogin()">Save & Log in to MyAnimeList</button>
</div>

<div id="loggedIn" class="card" style="display:none;">
  <div class="status">Logged in to MyAnimeList</div>
  <button class="btn-login" onclick="saveAndLogin()">Re-authenticate</button>
</div>

<div id="callback" class="card" style="display:none;">
  <div class="status" id="callbackStatus">Completing login...</div>
</div>

<div id="debug"></div>

<script>
function log(msg) {
  document.getElementById('debug').innerHTML += msg + '<br>';
}

var params = new URLSearchParams(location.search);
var clientId = params.get('client_id') || '';
var isLoggedIn = params.get('logged_in') === '1';
var authCode = params.get('code');

log('clientId from URL: ' + (clientId ? 'yes' : 'no'));
log('authCode: ' + (authCode ? 'yes' : 'no'));
log('localStorage client_id: ' + (localStorage.getItem('wristmal_client_id') || 'none'));
log('localStorage code_verifier: ' + (localStorage.getItem('wristmal_code_verifier') ? 'yes' : 'no'));

document.getElementById('clientId').value = clientId || localStorage.getItem('wristmal_client_id') || '';

if (authCode) {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('callback').style.display = 'block';
  returnAuthCode(authCode);
} else if (clientId && isLoggedIn) {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('loggedIn').style.display = 'block';
}

function saveAndLogin() {
  clientId = document.getElementById('clientId').value.trim();
  var clientSecret = document.getElementById('clientSecret').value.trim();
  if (!clientId) { alert('Client ID is required'); return; }

  localStorage.setItem('wristmal_client_id', clientId);
  localStorage.setItem('wristmal_client_secret', clientSecret);

  var codeVerifier = generateCodeVerifier();
  localStorage.setItem('wristmal_code_verifier', codeVerifier);

  var redirectUri = location.origin + location.pathname;
  localStorage.setItem('wristmal_redirect_uri', redirectUri);

  var url = 'https://myanimelist.net/v1/oauth2/authorize' +
    '?response_type=code' +
    '&client_id=' + encodeURIComponent(clientId) +
    '&code_challenge=' + encodeURIComponent(codeVerifier) +
    '&code_challenge_method=plain' +
    '&redirect_uri=' + encodeURIComponent(redirectUri);
  location.href = url;
}

function returnAuthCode(code) {
  var codeVerifier = localStorage.getItem('wristmal_code_verifier') || '';
  var clientSecret = localStorage.getItem('wristmal_client_secret') || '';
  clientId = localStorage.getItem('wristmal_client_id') || clientId;
  var redirectUri = localStorage.getItem('wristmal_redirect_uri') || location.origin + location.pathname;

  log('returning auth code to pkjs');
  log('have code_verifier: ' + (codeVerifier ? 'yes' : 'NO'));
  log('have client_id: ' + (clientId ? 'yes' : 'NO'));

  var data = {
    client_id: clientId,
    client_secret: clientSecret,
    auth_code: code,
    code_verifier: codeVerifier,
    redirect_uri: redirectUri,
  };

  log('closing config with: ' + JSON.stringify(data).substring(0, 100));

  localStorage.removeItem('wristmal_code_verifier');
  localStorage.removeItem('wristmal_client_secret');
  localStorage.removeItem('wristmal_redirect_uri');

  setTimeout(function() {
    closeConfig(data);
  }, 500);
}

function generateCodeVerifier() {
  var arr = new Uint8Array(64);
  crypto.getRandomValues(arr);
  return btoa(String.fromCharCode.apply(null, arr))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '').substring(0, 128);
}

function closeConfig(data) {
  location.href = 'pebblejs://close#' + encodeURIComponent(JSON.stringify(data));
}
</script>
</body>
</html>
